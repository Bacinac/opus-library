<!doctype html>
<html lang="hr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="/favicon.svg?v=demo" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=demo" />
		<link rel="manifest" href="/manifest.webmanifest?v=demo" />
		<meta name="theme-color" content="#0e1213" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="robots" content="noindex" />
		<title>OPUS · Library demo</title>
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					var dark =
						t === 'dark' ||
						!t ||
						(t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		<script src="/demo-net.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
